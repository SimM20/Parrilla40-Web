  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Private playtest results — Parrilla 40</title>
    <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/playtest.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script defer src="/playtest-config.js"></script>
  <script defer src="/playtest.js"></script>

<body class="playtest-page results-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="playtest-nav wrap"><a class="nav__brand" href="/en/"><span class="nav__dot"></span>PARRILLA 40</a><a href="/en/">Back to the site</a><div class="site-tools"><a class="site-control" href="/resultados/" lang="es" hreflang="es" aria-label="ES: Switch to Spanish" data-language-link>ES</a><button class="site-control" id="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="true" hidden><span aria-hidden="true">☀</span></button></div></header>
  <main class="wrap wrap--narrow playtest-main" id="main">
    <div class="playtest-intro">
      <picture><source type="image/avif" srcset="/assets/optimized/candado-169.avif 169w, /assets/optimized/candado-337.avif 337w" sizes="84px"><source type="image/webp" srcset="/assets/optimized/candado-169.webp 169w, /assets/optimized/candado-337.webp 337w" sizes="84px"><img class="px playtest-sprite" src="/assets/ui/candado.png" alt="" width="163" height="236" loading="eager" decoding="async"></picture>
      <p class="eyebrow">Parrilla 40 · Team</p>
      <h1 class="h2">After <em>the shift.</em></h1>
      <p class="lead">Private playtest results.</p>
    </div>
    <noscript><p class="feedback">Enable JavaScript to view the results.</p></noscript>
    <form id="gate" class="playtest-panel gate" novalidate>
      <p>Enter the team password to view responses.</p>
      <label for="results-source">Response dataset</label>
      <select id="results-source" name="results-source" aria-describedby="source-hint">
        <option value="current">Current survey · 3 questions</option>
        <option value="historical">Historical · previous questionnaire</option>
      </select>
      <p class="field-hint" id="source-hint">Current and historical data are accessed separately.</p>
      <label for="admin-password">Password</label>
      <input id="admin-password" name="admin-password" type="password" autocomplete="current-password" required aria-describedby="gate-status" spellcheck="false">
      <p class="feedback" id="gate-status" role="status" aria-live="polite"></p>
      <button class="btn" id="unlock" type="submit" disabled>View results</button>
    </form>
    <section id="dashboard" hidden aria-labelledby="results-heading">
      <h2 id="results-heading" tabindex="-1">Playtest results</h2>
      <div class="results-tools">
        <label id="build-filter-label" hidden>Game build<select id="build-filter"></select></label>
        <button class="btn btn--ghost" id="lock" type="button">Close results</button>
      </div>
      <div id="results-content" aria-live="polite"></div>
    </section>
  </main>
  <footer class="foot"><div class="wrap foot__in"><span class="foot__brand">PARRILLA 40</span><nav class="legal-links" aria-label="Legal information"><a href="/privacidad/en/">Privacy</a><a href="/terminos/en/">Terms</a><a href="/almacenamiento/en/">Storage</a></nav></div></footer>
</body>
</html>
